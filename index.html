                    <div className="setting-label">

                    <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>

                <button className="btn btn-primary btn-block" onClick={handleQuickGroup}>
                  <Icon.Shuffle /> 一键随机分组
                </button>

              {mode === 'wheel' && (
                <div className="card">
                  <div className="card-header">
                    <div className="card-title">
                      <div className="card-title-icon"><Icon.Wheel /></div>
                      转盘分组
                    </div>
                  </div>
                  <div className="card-body">
                    <p style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '14px', lineHeight: 1.6 }}>
                      转盘逐个抽取，依次分配到各组。
                      已分配 <strong style={{ color: 'var(--accent-cyan)' }}>{groups.reduce((s, g) => s + g.members.length, 0)}</strong> / {Math.min(totalNeeded, options.length)} 人
                    </p>
                    {spinning || wheelResult !== null ? (
                      <div style={{ textAlign: 'center', marginBottom: '12px' }}>
                        <div style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '4px' }}>
                          正在分配至
                        </div>
                        <div style={{ fontSize: '16px', fontWeight: 600, color: colors[currentAssignGroup % colors.length] }}>
                          {groups[currentAssignGroup]?.name}
                        </div>
                      </div>
                    ) : null}

                    {!spinning && wheelResult === null && (
                      <button
                        className="btn btn-primary btn-block"
                        onClick={handleWheelAssignStart}
                        disabled={remainingOptions.length === 0 || groups[currentAssignGroup]?.members.length >= perGroup}
                      >
                        <Icon.Play /> 开始抽取
                      </button>
                    )}

                    {!spinning && wheelResult !== null && (
                      <button className="btn btn-primary btn-block" onClick={handleConfirmAssign}>
                        <Icon.Check /> 确认分配到 {groups[currentAssignGroup]?.name}
                      </button>
                    )}
                  </div>
                </div>
              )}

              {/* Settlement */}
              {groups.some(g => g.members.length > 0) && (
                <div className="card">
                  <div className="card-header">
                    <div className="card-title">
                      <div className="card-title-icon"><Icon.Medal /></div>
                      比赛结算
                    </div>
                  </div>
                  <div className="card-body">
                    <p style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '14px' }}>
                      输入各组名次，自动计算积分
                    </p>
                    <div className="score-rules">
                      {groups.map((g, i) => (
                        <div key={g.id} className="score-rule-row">
                          <span className="score-rule-rank" style={{ color: colors[i % colors.length] }}>
                            {g.name}
                          </span>
                          <select
                            className="rank-select"
                            value={ranks[i] || ''}
                            onChange={e => handleRankChange(i, e.target.value)}
                            disabled={settled}
                            style={{ flex: 1 }}
                          >
                            <option value="">未排名</option>
                            {Array.from({ length: groupCount }, (_, j) => (
                              <option key={j+1} value={j+1}>第 {j+1} 名</option>
                            ))}
                          </select>
                          <span style={{ fontSize: '12px', color: 'var(--accent-gold)', width: '40px', textAlign: 'right' }}>
                            {ranks[i] ? `+${settings.scoreRules[ranks[i]] || 0}分` : '—'}
                          </span>
                        </div>
                      ))}
                    </div>
                    <div style={{ height: '14px' }} />
                    <button
                      className="btn btn-primary btn-block"
                      onClick={handleSettle}
                      disabled={settled}
                    >
                      <Icon.Trophy /> {settled ? '已结算' : '确认结算'}
                    </button>
                  </div>
                </div>
              )}
            </div>

            <div>
              {/* Wheel for grouping mode */}
              {mode === 'wheel' && remainingOptions.length > 0 && (
                <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '24px' }}>
                   <div className={`wheel-container ${spinning ? 'spinning' : ''}`} style={{ width: 'min(320px, 75vw)', height: 'min(320px, 75vw)' }}>
                    <div className="wheel-outer-ring"></div>
                    <div
                      className="wheel-pointer"
                      style={{ transform: `translateX(-50%) rotate(${groupPointerShake}deg)` }}
                    >
                      <svg viewBox="0 0 42 58" fill="none" style={{ width: '34px', height: '47px' }}>
                        <defs>
                          <linearGradient id="pointerGradGroup" x1="21" y1="0" x2="21" y2="58" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stopColor="#FEF3C7"/>
                            <stop offset="30%" stopColor="#FBBF24"/>
                            <stop offset="70%" stopColor="#F59E0B"/>
                            <stop offset="100%" stopColor="#B45309"/>
                          </linearGradient>
                          <radialGradient id="gemGradGroup" cx="50%" cy="40%" r="60%">
                            <stop offset="0%" stopColor="#FEF3C7"/>
                            <stop offset="50%" stopColor="#FBBF24"/>
                            <stop offset="100%" stopColor="#D97706"/>
                          </radialGradient>
                        </defs>
                        <path
                          d="M21 56 L6 22 C3 14 3 6 21 2 C39 6 39 14 36 22 L21 56 Z"
                          fill="url(#pointerGradGroup)"
                          stroke="#FCD34D"
                          strokeWidth="1.5"
                        />
                        <path
                          d="M15 12 C14 8 15 5 21 4 C19 8 17 10 15 12 Z"
                          fill="rgba(255,255,255,0.5)"
                        />
                        <circle cx="21" cy="16" r="6" fill="url(#gemGradGroup)" stroke="#FDE68A" strokeWidth="1.5"/>
                        <circle cx="19.5" cy="14.5" r="2" fill="rgba(255,255,255,0.6)"/>
                        <path
                          d="M21 56 L17 48 L25 48 Z"
                          fill="#92400E"
                        />
                      </svg>
                    </div>
                    <WheelCanvas
                      options={remainingOptions}
                      spinning={spinning}
                      result={wheelResult}
                      duration={settings.spinDuration}
                      schemeColors={colors}
                      onSpinEnd={handleWheelSpinEnd}
                      onPointerShake={setGroupPointerShake}
                    />
                    <div className="wheel-center" style={{ width: '50px', height: '50px' }}>
                      <Icon.Wheel style={{ width: '20px', height: '20px' }} />
                    </div>
                  </div>

              )}

              {groups.length > 0 ? (
                <div className="groups-grid">
                  {groups.map((group, i) => (
                    <div
                      key={group.id}
                      className="group-card"
                      onDragOver={handleDragOver}
                      onDrop={e => handleDrop(e, i)}
                      style={{ '--group-color': colors[i % colors.length] }}

                      <div className="group-header">
                        <div className="group-badge">{i + 1}</div>
                        <div className="group-info">
                          <div className="group-name">{group.name}</div>
                          <div className="group-count">{group.members.length} / {perGroup} 人</div>
                        </div>
                        {settled && ranks[i] && (
                          <span className="member-rank">第{ranks[i]}名</span>
                        )}
                      </div>
                      <div className="group-members">
                        {group.members.length === 0 ? (
                          <div style={{ fontSize: '12px', color: 'var(--text-muted)', padding: '12px', textAlign: 'center' }}>
                            暂无成员
                          </div>
                        ) : (
                          group.members.map((m, mi) => (
                            <div
                              key={mi}
                              className="group-member"
                              draggable={!settled}
                              onDragStart={e => handleDragStart(e, i, mi)}
                            >
                              <span className="member-dot" />
                              <span className="member-name">{m}</span>
                            </div>
                          ))
                        )}
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="card">
                  <div className="card-body">
                    <div className="empty-state">
                      <div className="empty-icon"><Icon.Users /></div>
                      <div className="empty-title">还未分组</div>
                      <div className="empty-desc">设置分组数量和每组人数，点击开始分组按钮</div>
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // ============ Leaderboard Page ============
    const LeaderboardPage = ({ leaderboard, scheme }) => {
      const colors = COLOR_SCHEMES[scheme].colors;

      const sorted = useMemo(() => {
        return [...leaderboard].sort((a, b) => {
          if (b.totalScore !== a.totalScore) return b.totalScore - a.totalScore;
          if (b.bestRank !== a.bestRank) return a.bestRank - b.bestRank;
          return b.gamesPlayed - a.gamesPlayed;
        });
      }, [leaderboard]);

      const getRankClass = (index) => {
        if (index === 0) return 'gold';
        if (index === 1) return 'silver';
        if (index === 2) return 'bronze';
        return '';
      };

      return (
        <div className="page">
          <div className="page-header">
            <h1 className="page-title">排行榜</h1>
            <p className="page-subtitle">累计积分、参赛次数、最佳名次</p>
          </div>

          <div className="leaderboard-layout">
            <div className="card">
              <div className="card-header">
                <div className="card-title">
                  <div className="card-title-icon"><Icon.Trophy /></div>
                  个人总积分榜
                </div>
                <span style={{ fontSize: '13px', color: 'var(--text-muted)', fontFamily: "'JetBrains Mono', monospace" }}>
                  {sorted.length} 位玩家
                </span>
              </div>
              <div className="card-body">
                {sorted.length === 0 ? (
                  <div className="empty-state">
                    <div className="empty-icon"><Icon.Trophy /></div>
                    <div className="empty-title">暂无排行数据</div>
                    <div className="empty-desc">完成比赛结算后，个人积分会累计到这里</div>
                  </div>
                ) : (
                  <div className="rank-list">
                    {sorted.map((item, i) => (
                      <div
                        key={item.name}
                        className={`rank-item ${getRankClass(i)}`}
                        style={{ animationDelay: `${i * 0.05}s` }}
                      >
                        <div className="rank-number">
                          {i < 3 ? ['🥇', '🥈', '🥉'][i] : i + 1}
                        </div>
                        <div
                          className="rank-avatar"
                          style={{ background: stringToColor(item.name, colors) }}
                        >
                          {getInitials(item.name)}
                        </div>
                        <div className="rank-info">
                          <div className="rank-name">{item.name}</div>
                          <div className="rank-stats">
                            <span>参赛 {item.gamesPlayed} 次</span>
                            <span>最佳 第{item.bestRank}名</span>
                          </div>
                        </div>
                        <div className="rank-score">
                          <div className="rank-score-value">{item.totalScore}</div>
                          <div className="rank-score-label">总积分</div>
                        </div>
                      </div>
                    ))}
                  </div>
                )}
              </div>
            </div>

            <div className="card">
              <div className="card-header">
                <div className="card-title">
                  <div className="card-title-icon"><Icon.Medal /></div>
                  统计数据
                </div>
              </div>
              <div className="card-body">
                {sorted.length === 0 ? (
                  <div className="empty-state" style={{ padding: '40px 20px' }}>
                    <div className="empty-icon"><Icon.Info /></div>
                    <div className="empty-desc">暂无数据</div>
                  </div>
                ) : (
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '16px' }}>
                    <div style={{ padding: '20px', background: 'var(--bg-secondary)', borderRadius: '12px', textAlign: 'center' }}>
                      <div style={{ fontSize: '32px', fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", color: 'var(--accent-cyan)' }}>
                        {sorted.length}
                      </div>
                      <div style={{ fontSize: '13px', color: 'var(--text-secondary)', marginTop: '4px' }}>总玩家数</div>
                    </div>
                    <div style={{ padding: '20px', background: 'var(--bg-secondary)', borderRadius: '12px', textAlign: 'center' }}>
                      <div style={{ fontSize: '32px', fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", color: 'var(--accent-purple)' }}>
                        {sorted.reduce((s, i) => s + i.gamesPlayed, 0)}
                      </div>
                      <div style={{ fontSize: '13px', color: 'var(--text-secondary)', marginTop: '4px' }}>总参赛场次</div>
                    </div>
                    <div style={{ padding: '20px', background: 'var(--bg-secondary)', borderRadius: '12px', textAlign: 'center' }}>
                      <div style={{ fontSize: '32px', fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", color: 'var(--accent-gold)' }}>
                        {sorted.reduce((s, i) => s + i.totalScore, 0)}
                      </div>
                      <div style={{ fontSize: '13px', color: 'var(--text-secondary)', marginTop: '4px' }}>总积分</div>
                    </div>
                    <div style={{ padding: '20px', background: 'var(--bg-secondary)', borderRadius: '12px', textAlign: 'center' }}>
                      <div style={{ fontSize: '32px', fontWeight: 700, fontFamily: "'JetBrains Mono', monospace", color: 'var(--accent-pink)' }}>
                        {sorted.length > 0 ? (sorted.reduce((s, i) => s + i.totalScore, 0) / sorted.length).toFixed(1) : 0}
                      </div>
                      <div style={{ fontSize: '13px', color: 'var(--text-secondary)', marginTop: '4px' }}>人均积分</div>
                    </div>
                  </div>
                )}
              </div>
            </div>
          </div>
        </div>
      );
    };

    // ============ History Page ============
    const HistoryPage = ({ history, setHistory, scheme }) => {
      const [detail, setDetail] = useState(null);
      const [confirmDelete, setConfirmDelete] = useState(null);
      const [search, setSearch] = useState('');
      const colors = COLOR_SCHEMES[scheme].colors;
      const { showToast } = useToast();

      const filtered = useMemo(() => {
        if (!search.trim()) return history;
        const q = search.toLowerCase();
        return history.filter(h => {
          if (h.type === 'wheel') return h.result?.toLowerCase().includes(q);
          if (h.type === 'group') return h.groups?.some(g =>
            g.name.toLowerCase().includes(q) || g.members.some(m => m.toLowerCase().includes(q))
          );
          return false;
        });
      }, [history, search]);

      const handleDelete = (id) => {
        setHistory(history.filter(h => h.id !== id));
        setConfirmDelete(null);
        showToast('已删除历史记录', 'success');
      };

      const handleExport = () => {
        const data = JSON.stringify(history, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `wheel-history-${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
        showToast('历史记录已导出', 'success');
      };

      return (
        <div className="page">
          <div className="page-header">
            <h1 className="page-title">历史记录</h1>
            <p className="page-subtitle">查看所有抽奖和分组记录</p>
          </div>

          <div className="card" style={{ marginBottom: '20px' }}>
            <div className="card-body" style={{ padding: '16px 20px', display: 'flex', gap: '12px', alignItems: 'center' }}>
              <input
                className="import-textarea"
                placeholder="搜索参与者、组名..."
                value={search}
                onChange={e => setSearch(e.target.value)}
                style={{ minHeight: 'auto', padding: '10px 14px' }}
              />
              <button className="btn btn-secondary" onClick={handleExport} disabled={history.length === 0}>
                <Icon.Download /> 导出
              </button>
            </div>
          </div>

          {filtered.length === 0 ? (
            <div className="card">
              <div className="card-body">
                <div className="empty-state">
                  <div className="empty-icon"><Icon.History /></div>
                  <div className="empty-title">{search ? '没有找到匹配记录' : '暂无历史记录'}</div>
                  <div className="empty-desc">{search ? '试试其他关键词' : '转盘抽奖和分组结果会自动记录在这里'}</div>
                </div>
              </div>
            </div>
          ) : (
            <div className="history-list">
              {filtered.map((h, idx) => (
                <div key={h.id} className="history-item" onClick={() => setDetail(h)}>
                  <div className="history-header">
                    <div className="history-type">
                      <span className="history-type-badge">
                        {h.type === 'wheel' ? '转盘抽奖' : '分组'}
                      </span>
                      {h.type === 'wheel' ? (
                        <span>结果：{h.result}</span>
                      ) : (
                        <span>{h.groups?.length} 组 · {h.groups?.reduce((s, g) => s + g.members.length, 0)} 人</span>
                      )}
                    </div>
                    <div className="history-time">{formatTime(h.timestamp)}</div>
                  </div>
                  {h.type === 'group' && (
                    <div className="history-preview">
                      {h.groups?.map((g, i) => (
                        <span
                          key={i}
                          className="history-tag"
                          style={{
                            borderLeft: `3px solid ${colors[i % colors.length]}`,
                            paddingLeft: '6px',
                          }}
                        >
                          {g.name}: {g.members.join(', ')}
                          {g.rank ? ` (第${g.rank}名)` : ''}
                        </span>
                      ))}
                    </div>
                  )}
                  {h.type === 'wheel' && (
                    <div className="history-preview">
                      {h.options?.map((opt, i) => (
                        <span
                          key={i}
                          className="history-tag"
                          style={opt === h.result ? { background: 'rgba(251, 191, 36, 0.15)', color: 'var(--accent-gold)' } : {}}
                        >
                          {opt}
                        </span>
                      ))}
                    </div>
                  )}
                  <div className="history-actions" onClick={e => e.stopPropagation()}>
                    <button className="btn btn-danger btn-sm" onClick={() => setConfirmDelete(h.id)}>
                      <Icon.Trash /> 删除
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* Detail Modal */}
          <Modal isOpen={!!detail} onClose={() => setDetail(null)} className="detail-modal">
            {detail && (
              <>
                <div className="detail-title">
                  {detail.type === 'wheel' ? '转盘抽奖记录' : '分组记录'}
                </div>
                <div className="detail-subtitle">{formatTime(detail.timestamp)}</div>

                {detail.type === 'wheel' && (
                  <div style={{ marginBottom: '20px' }}>
                    <div style={{ fontSize: '13px', color: 'var(--text-secondary)', marginBottom: '8px' }}>抽中结果</div>
                    <div style={{
                      fontSize: '24px', fontWeight: 700,
                      background: 'linear-gradient(135deg, var(--accent-gold), var(--accent-pink))',
                      WebkitBackgroundClip: 'text', WebkitTextFillColor: 'transparent',
                    }}>
                      {detail.result}
                    </div>
                  </div>
                )}

                {detail.type === 'group' && (
                  <div className="detail-groups">
                    {detail.groups?.map((g, i) => (
                      <div key={i} className="detail-group" style={{ '--group-color': colors[i % colors.length] }}>
                        <div className="detail-group-title">
                          {g.name}
                          {g.rank && <span style={{ color: 'var(--accent-gold)', marginLeft: '8px' }}>第{g.rank}名 · {g.score}分</span>}
                        </div>
                        <div className="detail-group-members">
                          {g.members.map((m, mi) => (
                            <span key={mi} className="history-tag">{m}</span>
                          ))}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                <button className="btn btn-secondary btn-block" onClick={() => setDetail(null)}>关闭</button>
              </>
            )}
          </Modal>

          <ConfirmDialog
            isOpen={!!confirmDelete}
            title="删除历史记录"
            description="确定要删除这条历史记录吗？此操作不可撤销。"
            confirmText="删除"
            danger
            onCancel={() => setConfirmDelete(null)}
            onConfirm={() => handleDelete(confirmDelete)}
          />
        </div>
      );
    };

    // ============ Settings Page ============
    const SettingsPage = ({ settings, setSettings, onClearData, onExportAll, onImportData }) => {
      const { showToast } = useToast();
      const fileInputRef = useRef(null);
      const [clearConfirm, setClearConfirm] = useState(false);

      const updateSetting = (key, value) => {
        setSettings(prev => ({ ...prev, [key]: value }));
      };

      const updateScoreRule = (rank, value) => {
        const newRules = { ...settings.scoreRules };
        newRules[rank] = parseInt(value) || 0;
        updateSetting('scoreRules', newRules);
      };

      const handleImportClick = () => {
        fileInputRef.current?.click();
      };

      const handleFileImport = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            onImportData(data);
            showToast('数据导入成功', 'success');
          } catch (err) {
            showToast('导入失败：文件格式错误', 'error');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const handleClear = () => {
        onClearData();
        setClearConfirm(false);
        showToast('所有数据已清空', 'success');
      };

      return (
        <div className="page">
          <div className="page-header">
            <h1 className="page-title">设置</h1>
            <p className="page-subtitle">自定义你的体验</p>
          </div>

          <div className="settings-layout">
            <div className="setting-group">
              <div className="card">
                <div className="card-header">
                  <div className="card-title">
                    <div className="card-title-icon"><Icon.Wheel /></div>
                    转盘设置
                  </div>
                </div>
                <div className="card-body" style={{ display: 'flex', flexDirection: 'column', gap: '12px', padding: '16px 20px' }}>
                  <div className="setting-item">
                    <div>
                      <div className="setting-item-label">转动时长</div>
                      <div className="setting-item-desc">{settings.spinDuration} 秒</div>
                    </div>
                    <input
                      type="range"
                      className="range-slider"
                      min="3"
                      max="15"
                      value={settings.spinDuration}
                      onChange={e => updateSetting('spinDuration', parseInt(e.target.value))}
                      style={{ width: '120px' }}
                    />
                  </div>
                </div>
              </div>

              <div className="card">
                <div className="card-header">
                  <div className="card-title">
                    <div className="card-title-icon"><Icon.Volume /></div>
                    音频设置
                  </div>
                </div>
                <div className="card-body" style={{ display: 'flex', flexDirection: 'column', gap: '12px', padding: '16px 20px' }}>
                  <div className="setting-item">
                    <div>
                      <div className="setting-item-label">背景音乐</div>
                      <div className="setting-item-desc">转动转盘时播放BGM</div>
                    </div>
                    <div
                      className={`toggle ${settings.bgmEnabled ? 'on' : ''}`}
                      onClick={() => updateSetting('bgmEnabled', !settings.bgmEnabled)}
                    />
                  </div>
                  <div className="setting-item">
                    <div>
                      <div className="setting-item-label">音量</div>
                      <div className="setting-item-desc">{Math.round(settings.bgmVolume * 100)}%</div>
                    </div>
                    <input
                      type="range"
                      className="range-slider"
                      min="0"
                      max="100"
                      value={settings.bgmVolume * 100}
                      onChange={e => updateSetting('bgmVolume', parseInt(e.target.value) / 100)}
                      style={{ width: '120px' }}
                    />
                  </div>
                </div>
              </div>

              <div className="card">
                <div className="card-header">
                  <div className="card-title">
                    <div className="card-title-icon"><Icon.Medal /></div>
                    积分规则
                  </div>
                </div>
                <div className="card-body" style={{ padding: '16px 20px' }}>
                  <div className="score-rules">
                    {[1, 2, 3, 4, 5, 6, 7, 8].map(rank => (
                      <div key={rank} className="score-rule-row">
                        <span className="score-rule-rank">第 {rank} 名</span>
                        <input
                          type="number"
                          className="score-rule-input"
                          value={settings.scoreRules[rank] ?? 0}
                          onChange={e => updateScoreRule(rank, e.target.value)}
                        />
                        <span style={{ fontSize: '12px', color: 'var(--text-muted)' }}>分</span>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>

            <div className="setting-group">
              <div className="card">
                <div className="card-header">
                  <div className="card-title">
                    <div className="card-title-icon"><Icon.Sun /></div>
                    外观设置
                  </div>
                </div>
                <div className="card-body" style={{ display: 'flex', flexDirection: 'column', gap: '12px', padding: '16px 20px' }}>
                  <div className="setting-item">
                    <div>
                      <div className="setting-item-label">主题模式</div>
                      <div className="setting-item-desc">{settings.theme === 'dark' ? '深色模式' : '浅色模式'}</div>
                    </div>
                    <div
                      className={`toggle ${settings.theme === 'light' ? 'on' : ''}`}
                      onClick={() => updateSetting('theme', settings.theme === 'dark' ? 'light' : 'dark')}
                    />
                  </div>
                </div>
              </div>

              <div className="card">
                <div className="card-header">
                  <div className="card-title">
                    <div className="card-title-icon"><Icon.Wheel /></div>
                    转盘配色
                  </div>
                </div>
                <div className="card-body" style={{ padding: '16px 20px' }}>
                  <div className="color-schemes">
                    {Object.entries(COLOR_SCHEMES).map(([key, scheme]) => (
                      <div
                        key={key}
                        className={`color-scheme ${settings.colorScheme === key ? 'active' : ''}`}
                        onClick={() => updateSetting('colorScheme', key)}
                      >
                        <div className="color-scheme-preview">
                          {scheme.colors.slice(0, 4).map((c, i) => (
                            <span key={i} style={{ background: c }} />
                          ))}
                        </div>
                        <div className="color-scheme-name">{scheme.name}</div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>

              <div className="card">
                <div className="card-header">
                  <div className="card-title">
                    <div className="card-title-icon"><Icon.Download /></div>
                    数据管理
                  </div>
                </div>
                <div className="card-body" style={{ display: 'flex', flexDirection: 'column', gap: '10px', padding: '16px 20px' }}>
                  <button className="btn btn-secondary btn-block" onClick={onExportAll}>
                    <Icon.Download /> 导出全部数据
                  </button>
                  <button className="btn btn-secondary btn-block" onClick={handleImportClick}>
                    <Icon.Upload /> 导入数据
                    <input
                      ref={fileInputRef}
                      type="file"
                      accept=".json"
                      className="file-input"
                      onChange={handleFileImport}
                    />
                  </button>
                  <button className="btn btn-danger btn-block" onClick={() => setClearConfirm(true)}>
                    <Icon.Trash /> 清空所有数据
                  </button>
                </div>
              </div>

              <div className="card">
                <div className="card-header">
                  <div className="card-title">
                    <div className="card-title-icon"><Icon.Info /></div>
                    关于
                  </div>
                </div>
                <div className="card-body" style={{ padding: '16px 20px', fontSize: '13px', color: 'var(--text-secondary)', lineHeight: 1.8 }}>
                  <p style={{ marginBottom: '8px' }}><strong style={{ color: 'var(--text-primary)' }}>游戏分组大转盘</strong></p>
                  <p style={{ marginBottom: '8px' }}>专为游戏组队设计的转盘工具，支持批量导入智能解析、多种分组模式、积分排行榜等功能。</p>
                  <p>所有数据保存在本地浏览器中，刷新不丢失。</p>
                </div>
              </div>
            </div>
          </div>

          <ConfirmDialog
            isOpen={clearConfirm}
            title="清空所有数据"
            description="确定要清空所有数据吗？包括选项列表、历史记录、排行榜和设置。此操作不可撤销！"
            confirmText="确认清空"
            danger
            onCancel={() => setClearConfirm(false)}
            onConfirm={handleClear}
          />
        </div>
      );
    };

    // ============ Main App ============
    const App = () => {
      const [page, setPage] = useState('wheel');
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

      // Data state
      const [options, setOptions] = useState([]);
      const [removedOptions, setRemovedOptions] = useState([]);
      const [history, setHistory] = useState([]);
      const [leaderboard, setLeaderboard] = useState([]);
      const [settings, setSettings] = useState({
        spinDuration: 6,
        bgmEnabled: true,
        bgmVolume: 0.5,
        theme: 'dark',
        colorScheme: 'neon',
        scoreRules: { ...DEFAULT_SCORE_RULES },
      });

      // Load data on mount
      useEffect(() => {
        const data = loadData();
        if (data) {
          if (data.options) setOptions(data.options);
          if (data.removedOptions) setRemovedOptions(data.removedOptions);
          if (data.history) setHistory(data.history);
          if (data.leaderboard) setLeaderboard(data.leaderboard);
          if (data.settings) setSettings(prev => ({ ...prev, ...data.settings }));
        }
      }, []);

      // Save data
      useEffect(() => {
        saveData({ options, removedOptions, history, leaderboard, settings });
      }, [options, history, leaderboard, settings]);

      // Apply theme
      useEffect(() => {
        document.documentElement.setAttribute('data-theme', settings.theme);
      }, [settings.theme]);

      const addHistory = (item) => {
        const newItem = { id: uid(), ...item };
        setHistory(prev => [newItem, ...prev].slice(0, 200)); // Keep last 200
      };

      const updateLeaderboard = (updates) => {
        setLeaderboard(prev => {
          const map = new Map(prev.map(p => [p.name, { ...p }]));
          updates.forEach(({ name, score, rank }) => {
            if (map.has(name)) {
              const entry = map.get(name);
              entry.totalScore += score;
              entry.gamesPlayed += 1;
              entry.bestRank = Math.min(entry.bestRank, rank);
            } else {
              map.set(name, {
                name,
                totalScore: score,
                gamesPlayed: 1,
                bestRank: rank,
              });
            }
          });
          return Array.from(map.values());
        });
      };

      const handleExportAll = () => {
        const data = { options, history, leaderboard, settings };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `game-wheel-data-${Date.now()}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const handleImportData = (data) => {
        if (data.options) setOptions(data.options);
        if (data.history) setHistory(data.history);
        if (data.leaderboard) setLeaderboard(data.leaderboard);
        if (data.settings) setSettings(prev => ({ ...prev, ...data.settings }));
      };

      const handleClearData = () => {
        setOptions([]);
        setRemovedOptions([]);
        setHistory([]);
        setLeaderboard([]);
      };

      const navItems = [
        { id: 'wheel', label: '转盘', icon: Icon.Wheel },
        { id: 'group', label: '分组', icon: Icon.Users },
        { id: 'rank', label: '排行榜', icon: Icon.Trophy },
        { id: 'history', label: '历史', icon: Icon.History },
        { id: 'settings', label: '设置', icon: Icon.Settings },
      ];

      const renderPage = () => {
        switch (page) {
          case 'wheel':
            return (
              <WheelPage
                key="wheel"
                options={options}
                setOptions={setOptions}
                removedOptions={removedOptions}
                setRemovedOptions={setRemovedOptions}
                scheme={settings.colorScheme}
                addHistory={addHistory}
                settings={settings}
              />
            );
          case 'group':
            return (
              <GroupingPage
                key="group"
                options={options}
                setOptions={setOptions}
                scheme={settings.colorScheme}
                addHistory={addHistory}
                settings={settings}
                updateLeaderboard={updateLeaderboard}
              />
            );
          case 'rank':
            return (
              <LeaderboardPage
                key="rank"
                leaderboard={leaderboard}
                scheme={settings.colorScheme}
              />
            );
          case 'history':
            return (
              <HistoryPage
                key="history"
                history={history}
                setHistory={setHistory}
                scheme={settings.colorScheme}
              />
            );
          case 'settings':
            return (
              <SettingsPage
                key="settings"
                settings={settings}
                setSettings={setSettings}
                onClearData={handleClearData}
                onExportAll={handleExportAll}
                onImportData={handleImportData}
              />
            );
          default:
            return null;
        }
      };

      return (
        <ToastProvider>
          <div className="ambient-orb purple" />
          <div className="ambient-orb cyan" />
          <div className="ambient-orb pink" />

          <div className="app-container">
            <nav className="navbar">
              <div className="nav-brand">
                <div className="nav-logo">
                  <Icon.Wheel />
                </div>
                <span className="nav-title">游戏分组大转盘</span>
              </div>

              <div className={`nav-links ${mobileMenuOpen ? 'open' : ''}`}>
                {navItems.map(item => (
                  <button
                    key={item.id}
                    className={`nav-link ${page === item.id ? 'active' : ''}`}
                    onClick={() => {
                      setPage(item.id);
                      setMobileMenuOpen(false);
                    }}
                  >
                    <item.icon />
                    {item.label}
                  </button>
                ))}
              </div>

              <div className="nav-actions">
                <button
                  className="icon-btn mobile-menu-btn"
                  onClick={() => setMobileMenuOpen(!mobileMenuOpen)}
                >
                  {mobileMenuOpen ? <Icon.X /> : <Icon.Menu />}
                </button>
                <button
                  className="icon-btn"
                  onClick={() => setSettings(s => ({ ...s, theme: s.theme === 'dark' ? 'light' : 'dark' }))}
                  title={settings.theme === 'dark' ? '切换浅色' : '切换深色'}
                >
                  {settings.theme === 'dark' ? <Icon.Sun /> : <Icon.Moon />}
                </button>
              </div>
            </nav>

            <main className="main-content">
              {renderPage()}
            </main>
          </div>
        </ToastProvider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
