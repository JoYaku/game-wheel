<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>游戏分组大转盘</title>
  <meta name="creative-medium" content="interactive-prototype">
  <link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0F0A1F;
      --bg-secondary: #1A1330;
      --bg-card: rgba(30, 27, 46, 0.7);
      --bg-card-hover: rgba(40, 36, 60, 0.85);
      --border-glow: rgba(168, 85, 247, 0.3);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --text-primary: #F3F4F6;
      --text-secondary: #9CA3AF;
      --text-muted: #6B7280;
      --accent-purple: #A855F7;
      --accent-cyan: #22D3EE;
      --accent-pink: #EC4899;
      --accent-gold: #FBBF24;
      --accent-green: #34D399;
      --accent-red: #F87171;
      --shadow-glow-purple: 0 0 40px rgba(168, 85, 247, 0.3);
      --shadow-glow-cyan: 0 0 40px rgba(34, 211, 238, 0.2);
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 8px;
      --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="light"] {
      --bg-primary: #F5F3FF;
      --bg-secondary: #EDE9FE;
      --bg-card: rgba(255, 255, 255, 0.85);
      --bg-card-hover: rgba(255, 255, 255, 1);
      --border-glow: rgba(139, 92, 246, 0.2);
      --border-subtle: rgba(0, 0, 0, 0.08);
      --text-primary: #1F2937;
      --text-secondary: #4B5563;
      --text-muted: #9CA3AF;
    }

    html, body {
      height: 100%;
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body {
      position: relative;
      background:
        radial-gradient(ellipse at 20% 0%, rgba(168, 85, 247, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(34, 211, 238, 0.1) 0%, transparent 50%),
        var(--bg-primary);
    }

    [data-theme="light"] body {
      background:
        radial-gradient(ellipse at 20% 0%, rgba(168, 85, 247, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 100%, rgba(34, 211, 238, 0.08) 0%, transparent 50%),
        var(--bg-primary);
    }

    /* Ambient floating orbs */
    .ambient-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.4;
      pointer-events: none;
      z-index: 0;
      animation: float 20s ease-in-out infinite;
    }
    .ambient-orb.purple { width: 400px; height: 400px; background: var(--accent-purple); top: -100px; left: -100px; }
    .ambient-orb.cyan { width: 300px; height: 300px; background: var(--accent-cyan); bottom: -50px; right: -50px; animation-delay: -10s; }
    .ambient-orb.pink { width: 250px; height: 250px; background: var(--accent-pink); top: 40%; right: 10%; animation-delay: -5s; opacity: 0.2; }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(30px, -30px) scale(1.1); }
      66% { transform: translate(-20px, 20px) scale(0.95); }
    }

    .app-container {
      position: relative;
      z-index: 1;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navigation */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid var(--border-subtle);
      background: rgba(15, 10, 31, 0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      position: relative;
      z-index: 100;
    }
    [data-theme="light"] .navbar {
      background: rgba(245, 243, 255, 0.8);
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: var(--shadow-glow-purple);
    }
    .nav-logo svg { width: 22px; height: 22px; color: white; }
    .nav-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--text-primary), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-links {
      display: flex;
      gap: 4px;
      background: var(--bg-card);
      padding: 6px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }
    .nav-link:hover {
      color: var(--text-primary);
      background: var(--bg-card-hover);
    }
    .nav-link.active {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(34, 211, 238, 0.15));
      color: var(--text-primary);
      box-shadow: inset 0 0 0 1px var(--border-glow);
    }
    .nav-link svg { width: 18px; height: 18px; }

    .nav-actions {
      display: flex;
      gap: 8px;
    }
    .icon-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-secondary);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all var(--transition);
    }
    .icon-btn:hover {
      color: var(--text-primary);
      border-color: var(--border-glow);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
    }
    .icon-btn svg { width: 18px; height: 18px; }

    /* Main content */
    .main-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 32px;
    }
    .main-content::-webkit-scrollbar { width: 8px; }
    .main-content::-webkit-scrollbar-track { background: transparent; }
    .main-content::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 4px;
    }
    .main-content::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    .page {
      max-width: 1280px;
      margin: 0 auto;
      animation: pageIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @keyframes pageIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-header {
      margin-bottom: 28px;
    }
    .page-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 6px;
    }
    .page-subtitle {
      color: var(--text-secondary);
      font-size: 15px;
    }

    /* Cards */
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      overflow: hidden;
      transition: all var(--transition);
    }
    .card:hover {
      border-color: var(--border-glow);
    }
    .card-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .card-title-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(34, 211, 238, 0.15));
      color: var(--accent-purple);
    }
    .card-title-icon svg { width: 16px; height: 16px; }
    .card-body { padding: 24px; }

    /* Wheel page layout */
    .wheel-layout {
      display: grid;
      grid-template-columns: 1fr 400px;
      gap: 28px;
      align-items: start;
    }
    @media (max-width: 1024px) {
      .wheel-layout { grid-template-columns: 1fr !important; }
    }

    @media (max-width: 600px) {
      .wheel-container {
        width: 100% !important;
        max-width: 85vw !important;
      }
      .wheel-section { gap: 18px; }
    }
    .wheel-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      width: 100%;
      box-sizing: border-box;
    }
    .wheel-container {
      position: relative;
      width: 100%;
      max-width: 460px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wheel-outer-ring {
      position: absolute;
      inset: -14px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--accent-purple), var(--accent-cyan), var(--accent-pink), var(--accent-gold), var(--accent-purple));
      filter: blur(24px);
      opacity: 0.45;
      animation: ringRotate 10s linear infinite;
      transition: opacity 0.4s ease;
    }
    .wheel-container.spinning .wheel-outer-ring {
      opacity: 0.7;
      animation-duration: 4s;
    }
    @keyframes ringRotate {
      to { transform: rotate(360deg); }
    }

    .wheel-canvas {
      position: relative;
      z-index: 2;
      width: 100% !important;
      height: 100% !important;
      border-radius: 50%;
      display: block;
      box-shadow:
        0 0 60px rgba(168, 85, 247, 0.25),
        0 0 120px rgba(168, 85, 247, 0.1),
        inset 0 0 40px rgba(0, 0, 0, 0.3);
      transition: box-shadow 0.4s ease;
    }
    .wheel-container.spinning .wheel-canvas {
      box-shadow:
        0 0 80px rgba(168, 85, 247, 0.4),
        0 0 160px rgba(251, 191, 36, 0.15),
        inset 0 0 40px rgba(0, 0, 0, 0.3);
    }

    .wheel-pointer {
      position: absolute;
      top: -2%;
      left: 50%;
      transform-origin: 50% 12%;
      transform: translateX(-50%) rotate(0deg);
      z-index: 15;
      width: clamp(32px, 9vw, 42px);
      height: clamp(44px, 12.5vw, 58px);
      filter: drop-shadow(0 6px 16px rgba(251, 191, 36, 0.6)) drop-shadow(0 0 8px rgba(251, 191, 36, 0.4));
      pointer-events: none;
      transition: filter 0.3s ease;
    }
    .wheel-container.spinning .wheel-pointer {
      filter: drop-shadow(0 8px 20px rgba(251, 191, 36, 0.8)) drop-shadow(0 0 16px rgba(251, 191, 36, 0.6));
    }

    .wheel-center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      width: clamp(52px, 15.5vw, 72px);
      height: clamp(52px, 15.5vw, 72px);
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, var(--bg-secondary), var(--bg-primary));
      border: 3px solid var(--accent-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 30px rgba(168, 85, 247, 0.4),
        inset 0 2px 6px rgba(255, 255, 255, 0.1),
        inset 0 -2px 6px rgba(0, 0, 0, 0.3);
      animation: centerPulse 3s ease-in-out infinite;
    }
    .wheel-center svg { width: 28px; height: 28px; color: var(--accent-purple); }
    @keyframes centerPulse {
      0%, 100% { box-shadow: 0 0 30px rgba(168, 85, 247, 0.4), inset 0 2px 6px rgba(255, 255, 255, 0.1); }
      50% { box-shadow: 0 0 45px rgba(168, 85, 247, 0.6), inset 0 2px 6px rgba(255, 255, 255, 0.15); }
    }

    /* Spin button */
    .spin-btn {
      position: relative;
      padding: 18px 56px;
      font-size: 18px;
      font-weight: 600;
      font-family: inherit;
      color: white;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
      border: none;
      border-radius: 16px;
      cursor: pointer;
      overflow: hidden;
      transition: all var(--transition);
      box-shadow: 0 8px 32px rgba(168, 85, 247, 0.4);
      letter-spacing: 0.02em;
    }
    .spin-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      opacity: 0;
      transition: opacity var(--transition);
    }
    .spin-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(168, 85, 247, 0.5);
    }
    .spin-btn:hover::before { opacity: 1; }
    .spin-btn:active { transform: translateY(0); }
    .spin-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .spin-btn span {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .spin-btn svg { width: 20px; height: 20px; }

    /* Options panel */
    .options-panel { display: flex; flex-direction: column; gap: 20px; }

    .import-textarea {
      width: 100%;
      min-height: 160px;
      padding: 16px;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      resize: vertical;
      transition: border-color var(--transition);
    }
    .import-textarea:focus {
      outline: none;
      border-color: var(--accent-purple);
      box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.1);
    }
    .import-textarea::placeholder { color: var(--text-muted); }

    .import-hint {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .import-hint code {
      background: var(--bg-secondary);
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      color: var(--accent-cyan);
    }

    .btn {
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
      border: 1px solid transparent;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }
    .btn svg { width: 16px; height: 16px; }
    .btn-primary {
      background: linear-gradient(135deg, var(--accent-purple), #7C3AED);
      color: white;
      border-color: transparent;
    }
    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.35);
    }
    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }
    .btn-secondary:hover {
      border-color: var(--border-glow);
      background: var(--bg-card-hover);
    }
    .btn-danger {
      background: transparent;
      color: var(--accent-red);
      border-color: rgba(248, 113, 113, 0.3);
    }
    .btn-danger:hover {
      background: rgba(248, 113, 113, 0.1);
      border-color: var(--accent-red);
    }
    .btn-sm { padding: 8px 14px; font-size: 13px; }
    .btn-block { width: 100%; justify-content: center; }

    .btn-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Options list */
    .options-list {
      max-height: 280px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 4px;
    }
    .options-list::-webkit-scrollbar { width: 6px; }
    .options-list::-webkit-scrollbar-track { background: transparent; }
    .options-list::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }

    .option-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: var(--bg-secondary);
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      transition: all 0.2s;
    }
    .option-item:hover {
      border-color: var(--border-glow);
    }
    .option-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .option-name {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-family: inherit;
      outline: none;
      padding: 4px 0;
    }
    .option-name:focus {
      background: rgba(168, 85, 247, 0.1);
      border-radius: 4px;
      padding: 4px 6px;
    }
    .option-remove {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .option-remove:hover {
      background: rgba(248, 113, 113, 0.15);
      color: var(--accent-red);
    }
    .option-remove svg { width: 14px; height: 14px; }

    .option-restore {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: none;
      background: transparent;
      color: var(--accent-green);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .option-restore:hover {
      background: rgba(52, 211, 153, 0.15);
      color: var(--accent-green);
    }

    .removed-card {
      opacity: 0.85;
      border-color: rgba(107, 114, 128, 0.25);
    }
    .removed-card:hover {
      border-color: rgba(107, 114, 128, 0.4);
    }
    .removed-item {
      opacity: 0.6;
    }
    .removed-name {
      flex: 1;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: line-through;
      text-decoration-color: var(--text-muted);
      padding: 4px 0;
    }

    .options-count {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .options-count strong {
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Result modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      background: var(--bg-secondary);
      border: 1px solid var(--border-glow);
      border-radius: 24px;
      padding: 48px 56px;
      text-align: center;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5), var(--shadow-glow-purple);
      animation: modalIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.8) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .result-label {
      font-size: 14px;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.15em;
      margin-bottom: 16px;
    }
    .result-winner {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 24px;
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: winnerPulse 2s ease-in-out infinite;
    }
    @keyframes winnerPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .result-winner-color {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      border-radius: 50%;
      box-shadow: 0 0 40px currentColor;
      animation: colorPulse 1.5s ease-in-out infinite;
    }
    @keyframes colorPulse {
      0%, 100% { box-shadow: 0 0 40px currentColor, 0 0 80px currentColor; }
      50% { box-shadow: 0 0 60px currentColor, 0 0 120px currentColor; }
    }

    .confetti-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
    }

    /* Grouping page */
    .grouping-layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 28px;
    }
    @media (max-width: 1024px) {
      .grouping-layout { grid-template-columns: 1fr; }
    }

    .group-settings { display: flex; flex-direction: column; gap: 20px; }

    .setting-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .setting-label {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .setting-value {
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent-cyan);
      font-weight: 600;
    }

    .range-slider {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--bg-primary);
      outline: none;
    }
    .range-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      cursor: pointer;
      box-shadow: 0 0 12px rgba(168, 85, 247, 0.5);
      transition: transform 0.2s;
    }
    .range-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .mode-tabs {
      display: flex;
      background: var(--bg-primary);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
    }
    .mode-tab {
      flex: 1;
      padding: 10px;
      border-radius: 7px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all var(--transition);
    }
    .mode-tab.active {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.25), rgba(34, 211, 238, 0.15));
      color: var(--text-primary);
      box-shadow: inset 0 0 0 1px var(--border-glow);
    }

    /* Groups display */
    .groups-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
    }
    @media (max-width: 600px) {
      .groups-grid { grid-template-columns: 1fr; }
    }

    .group-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: all var(--transition);
    }
    .group-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
    }
    .group-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: relative;
    }
    .group-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--group-color, var(--accent-purple));
    }
    .group-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      color: white;
      background: var(--group-color, var(--accent-purple));
      box-shadow: 0 4px 12px var(--group-color, rgba(168, 85, 247, 0.4));
    }
    .group-info { flex: 1; }
    .group-name {
      font-size: 15px;
      font-weight: 600;
    }
    .group-count {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .group-members {
      padding: 0 20px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .group-member {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 12px;
      background: var(--bg-secondary);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      cursor: grab;
      transition: all 0.2s;
      border: 1px solid transparent;
    }
    .group-member:hover {
      border-color: var(--group-color, var(--accent-purple));
    }
    .group-member:active { cursor: grabbing; }
    .member-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--group-color, var(--accent-purple));
    }
    .member-name { flex: 1; }
    .member-rank {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(251, 191, 36, 0.15);
      color: var(--accent-gold);
      font-weight: 600;
    }

    /* Leaderboard page */
    .leaderboard-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
    }
    @media (max-width: 1024px) {
      .leaderboard-layout { grid-template-columns: 1fr; }
    }

    .rank-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .rank-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      transition: all var(--transition);
      animation: rankIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) backwards;
    }
    @keyframes rankIn {
      from { opacity: 0; transform: translateX(-10px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .rank-item:hover {
      border-color: var(--border-glow);
      transform: translateX(4px);
    }
    .rank-item.gold { border-left: 3px solid #FBBF24; }
    .rank-item.silver { border-left: 3px solid #D1D5DB; }
    .rank-item.bronze { border-left: 3px solid #D97706; }

    .rank-number {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
      background: var(--bg-secondary);
      font-family: 'JetBrains Mono', monospace;
    }
    .rank-item.gold .rank-number { background: linear-gradient(135deg, #FBBF24, #F59E0B); color: #1F2937; }
    .rank-item.silver .rank-number { background: linear-gradient(135deg, #D1D5DB, #9CA3AF); color: #1F2937; }
    .rank-item.bronze .rank-number { background: linear-gradient(135deg, #F59E0B, #D97706); color: #1F2937; }

    .rank-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 600;
      color: white;
      flex-shrink: 0;
    }
    .rank-info { flex: 1; min-width: 0; }
    .rank-name {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .rank-stats {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      gap: 12px;
    }
    .rank-score {
      text-align: right;
    }
    .rank-score-value {
      font-size: 22px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .rank-score-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* History page */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .history-item {
      padding: 18px 20px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      transition: all var(--transition);
      cursor: pointer;
    }
    .history-item:hover {
      border-color: var(--border-glow);
    }
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .history-type {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 600;
    }
    .history-type-badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: rgba(34, 211, 238, 0.15);
      color: var(--accent-cyan);
    }
    .history-time {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }
    .history-preview {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .history-tag {
      padding: 3px 8px;
      background: var(--bg-secondary);
      border-radius: 4px;
      font-size: 12px;
    }
    .history-actions {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-subtle);
    }

    /* Settings page */
    .settings-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      max-width: 900px;
    }
    @media (max-width: 900px) {
      .settings-layout { grid-template-columns: 1fr; }
    }

    .setting-group { display: flex; flex-direction: column; gap: 16px; }
    .setting-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      transition: all var(--transition);
    }
    .setting-item:hover { border-color: var(--border-glow); }
    .setting-item-label {
      font-size: 14px;
      font-weight: 500;
    }
    .setting-item-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Toggle switch */
    .toggle {
      position: relative;
      width: 48px;
      height: 28px;
      border-radius: 14px;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      transition: all var(--transition);
      flex-shrink: 0;
    }
    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--text-muted);
      transition: all var(--transition);
    }
    .toggle.on {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-cyan));
      border-color: transparent;
    }
    .toggle.on::after {
      left: 23px;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    /* Scoring rules editor */
    .score-rules {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .score-rule-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .score-rule-rank {
      width: 60px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }
    .score-rule-input {
      flex: 1;
      padding: 8px 12px;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      text-align: center;
    }
    .score-rule-input:focus {
      outline: none;
      border-color: var(--accent-purple);
    }

    /* Color scheme selector */
    .color-schemes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .color-scheme {
      padding: 12px;
      border-radius: 10px;
      border: 2px solid var(--border-subtle);
      background: var(--bg-card);
      cursor: pointer;
      transition: all var(--transition);
      text-align: center;
    }
    .color-scheme:hover { border-color: var(--border-glow); }
    .color-scheme.active {
      border-color: var(--accent-purple);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
    }
    .color-scheme-preview {
      height: 24px;
      border-radius: 4px;
      margin-bottom: 8px;
      display: flex;
      overflow: hidden;
    }
    .color-scheme-preview span { flex: 1; }
    .color-scheme-name {
      font-size: 12px;
      font-weight: 500;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      top: 80px;
      right: 24px;
      z-index: 2000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      padding: 12px 20px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-glow);
      border-radius: 10px;
      font-size: 14px;
      font-weight: 500;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      animation: toastIn 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .toast.success { border-color: rgba(52, 211, 153, 0.4); }
    .toast.success .toast-icon { color: var(--accent-green); }
    .toast.error { border-color: rgba(248, 113, 113, 0.4); }
    .toast.error .toast-icon { color: var(--accent-red); }
    .toast.info .toast-icon { color: var(--accent-cyan); }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(30px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .toast.out {
      animation: toastOut 0.3s ease forwards;
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateX(0); }
      to { opacity: 0; transform: translateX(30px); }
    }
    .toast-icon svg { width: 18px; height: 18px; }

    /* Empty state */
    .empty-state {
      padding: 60px 20px;
      text-align: center;
    }
    .empty-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
    }
    .empty-icon svg { width: 28px; height: 28px; }
    .empty-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .empty-desc {
      font-size: 14px;
      color: var(--text-muted);
      max-width: 360px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* Confirm dialog */
    .confirm-modal .modal {
      padding: 32px;
      text-align: left;
    }
    .confirm-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    .confirm-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .confirm-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    /* Settlement section */
    .settlement-section {
      margin-top: 24px;
      padding-top: 24px;
      border-top: 1px solid var(--border-subtle);
    }
    .settlement-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .rank-input-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .rank-select {
      padding: 6px 10px;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      color: var(--text-primary);
      font-size: 12px;
      font-family: inherit;
      cursor: pointer;
    }
    .rank-select:focus { outline: none; border-color: var(--accent-purple); }

    /* Mobile nav */
    .mobile-menu-btn {
      display: none;
    }
    @media (max-width: 900px) {
      .navbar { padding: 12px 16px; }
      .nav-title { display: none; }
      .nav-links {
        position: fixed;
        top: 64px;
        left: 50%;
        transform: translateX(-50%);
        flex-direction: column;
        width: calc(100% - 32px);
        max-width: 320px;
        padding: 12px;
        background: var(--bg-secondary);
        border: 1px solid var(--border-subtle);
        border-radius: var(--radius-lg);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        z-index: 200;
        opacity: 0;
        pointer-events: none;
        transition: all var(--transition);
      }
      .nav-links.open {
        opacity: 1;
        pointer-events: auto;
        transform: translateX(-50%) translateY(0);
      }
      .mobile-menu-btn { display: flex; }
      .main-content { padding: 16px 12px; }
      .page-title { font-size: 24px; }
      .wheel-section { gap: 18px; }
      .spin-btn { padding: 14px 40px; font-size: 16px; }
      .options-panel { gap: 16px; }
      .import-textarea { min-height: 120px; font-size: 14px; padding: 12px; }
    }

    @media (max-width: 480px) {
      .page-title { font-size: 20px; }
      .wheel-section { gap: 14px; }
      .spin-btn { padding: 14px 32px; font-size: 15px; }
      .card-title { font-size: 14px; }
      .option-name { font-size: 14px; }
      .options-count { font-size: 12px; }
    }

    /* History detail modal */
    .detail-modal .modal {
      text-align: left;
      max-width: 560px;
    }
    .detail-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .detail-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }
    .detail-groups {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }
    .detail-group {
      padding: 12px 16px;
      background: var(--bg-primary);
      border-radius: var(--radius-md);
      border-left: 3px solid var(--group-color, var(--accent-purple));
    }
    .detail-group-title {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .detail-group-members {
      font-size: 13px;
      color: var(--text-secondary);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    /* File input */
    .file-input {
      display: none;
    }
  </style>
</head>

    const parseNames = (text) => {
      if (!text.trim()) return [];
      const lines = text.split(/[\n\r]+/);
      const names = [];
      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed) continue;

        const hashIndex = trimmed.indexOf('#');
        if (hashIndex > 0) {
          // 含 # 号：# 前面整段是完整名字（保留中间空格）
          let name = trimmed.substring(0, hashIndex).trim();
          name = name
            .replace(/進入組隊房間.*$/, '')
            .replace(/进入组队房间.*$/, '')
            .replace(/joined.*$/i, '')
            .trim();
          if (name) names.push(name);
          continue;

        // 不含 # 号：按逗号、顿号、空格等分隔符拆分
        let cleaned = trimmed
          .replace(/進入組隊房間.*$/, '')
          .replace(/进入组队房间.*$/, '')
          .replace(/joined.*$/i, '')
          .trim();
        const parts = cleaned.split(/[,，、\s]+/).filter(p => p.trim().length > 0);
        names.push(...parts);

    const useConfetti = () => {
      const canvasRef = useRef(null);
      const activeRef = useRef(false);

      const trigger = useCallback(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        const ctx = canvas.getContext('2d');
        const colors = ['#A855F7', '#22D3EE', '#EC4899', '#FBBF24', '#34D399', '#F87171'];
        const particles = [];
        const count = 150;

        for (let i = 0; i < count; i++) {
          particles.push({
            x: window.innerWidth / 2 + (Math.random() - 0.5) * 200,
            y: window.innerHeight / 2,
            vx: (Math.random() - 0.5) * 12,
            vy: (Math.random() - 1) * 14,
            size: Math.random() * 8 + 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            rotation: Math.random() * 360,
            rotationSpeed: (Math.random() - 0.5) * 10,
            gravity: 0.3,
            drag: 0.98,
          });
        }

        activeRef.current = true;
        let frame = 0;
        const maxFrames = 180;

        const animate = () => {
          if (!activeRef.current || frame > maxFrames) return;
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          frame++;

          for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.vy += p.gravity;
            p.vx *= p.drag;
            p.vy *= p.drag;
            p.x += p.vx;
            p.y += p.vy;
            p.rotation += p.rotationSpeed;

            const alpha = Math.max(0, 1 - frame / maxFrames);
            ctx.save();
            ctx.translate(p.x, p.y);
            ctx.rotate((p.rotation * Math.PI) / 180);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = alpha;
            ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
            ctx.restore();

            if (p.y > canvas.height + 20) {
              particles.splice(i, 1);
            }
          }

          if (particles.length > 0 && frame < maxFrames) {
            requestAnimationFrame(animate);
          } else {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            activeRef.current = false;
          }
        };
        animate();
      }, []);

      return { canvasRef, trigger };

    // ============ Wheel Canvas Component ============
    const WheelCanvas = ({ options, spinning, result, duration, schemeColors, onSpinEnd, onPointerShake }) => {

      // Keep refs in sync with latest props
      useEffect(() => { optionsRef.current = options; }, [options]);
      useEffect(() => { durationRef.current = duration; }, [duration]);
      useEffect(() => { onSpinEndRef.current = onSpinEnd; }, [onSpinEnd]);
      useEffect(() => { onPointerShakeRef.current = onPointerShake; }, [onPointerShake]);

      const shadeColor = (hex, percent) => {
        const num = parseInt(hex.replace('#', ''), 16);
        const amt = Math.round(2.55 * percent);
        const R = Math.max(0, Math.min(255, (num >> 16) + amt));
        const G = Math.max(0, Math.min(255, ((num >> 8) & 0x00FF) + amt));
        const B = Math.max(0, Math.min(255, (num & 0x0000FF) + amt));
        return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
      };

      const lightenColor = (hex, percent) => shadeColor(hex, percent);

      // Draw wheel
      const draw = useCallback((rotation, winnerIdx = null, winnerHighlight = 0) => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const w = canvas.width;
        const h = canvas.height;
        const cx = w / 2;
        const cy = h / 2;
        const radius = Math.min(cx, cy) - 20;
        const innerRadius = radius * 0.24;

        ctx.clearRect(0, 0, w, h);

        // Outer glow aura
        const auraGrad = ctx.createRadialGradient(cx, cy, radius - 8, cx, cy, radius + 20);
        auraGrad.addColorStop(0, 'rgba(251, 191, 36, 0.12)');
        auraGrad.addColorStop(0.4, 'rgba(168, 85, 247, 0.2)');
        auraGrad.addColorStop(1, 'rgba(168, 85, 247, 0)');
        ctx.fillStyle = auraGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius + 20, 0, Math.PI * 2);
        ctx.fill();

        // Outer metallic ring
        const ringGrad = ctx.createRadialGradient(cx, cy, radius - 3, cx, cy, radius + 6);
        ringGrad.addColorStop(0, '#FBBF24');
        ringGrad.addColorStop(0.5, '#F59E0B');
        ringGrad.addColorStop(1, '#92400E');
        ctx.fillStyle = ringGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, radius + 5, 0, Math.PI * 2);
        ctx.fill();

        // Inner dark circle (background for sectors)
        ctx.fillStyle = '#0F0A1F';
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();

        if (options.length === 0) {
          ctx.fillStyle = '#6B7280';
          ctx.font = '600 18px "Space Grotesk", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('添加选项开始使用', cx, cy);
          return;
        }

        const numSectors = options.length;
        const sectorAngle = (Math.PI * 2) / numSectors;

        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(rotation);

        for (let i = 0; i < numSectors; i++) {
          const startAngle = -Math.PI / 2 + i * sectorAngle;
          const endAngle = startAngle + sectorAngle;
          const color = colors[i % colors.length];
          const isWinner = winnerIdx === i;

          // Sector fill with radial gradient
          const sectorGrad = ctx.createRadialGradient(0, 0, innerRadius * 0.8, 0, 0, radius);
          if (isWinner) {
            sectorGrad.addColorStop(0, lightenColor(color, 25 + winnerHighlight * 20));
            sectorGrad.addColorStop(1, lightenColor(color, 5 + winnerHighlight * 15));
          } else {
            sectorGrad.addColorStop(0, lightenColor(color, 10));
            sectorGrad.addColorStop(1, shadeColor(color, -15));
          }

          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius, startAngle, endAngle);
          ctx.closePath();
          ctx.fillStyle = sectorGrad;
          ctx.fill();

          // Sector divider (white line)
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius, startAngle, startAngle);
          ctx.stroke();

          // Outer rim highlight per sector
          ctx.strokeStyle = `rgba(255, 255, 255, ${isWinner ? 0.5 : 0.2})`;
          ctx.lineWidth = isWinner ? 3 : 1.5;
          ctx.beginPath();
          ctx.arc(0, 0, radius - 2, startAngle + 0.005, endAngle - 0.005);
          ctx.stroke();

          // Text — radiate outward, upright on both left and right halves
          ctx.save();
          const centerAngle = startAngle + sectorAngle / 2;
          ctx.rotate(centerAngle);
          const isLeftSide = Math.cos(centerAngle) < 0; // x component negative = left half
          ctx.textBaseline = 'middle';
          ctx.fillStyle = '#FFFFFF';
          const fontSize = Math.max(10, Math.min(18, radius / Math.max(numSectors, 4) * 0.72));
          ctx.font = `600 ${fontSize}px "Space Grotesk", sans-serif`;
          ctx.shadowColor = 'rgba(0, 0, 0, 0.6)';
          ctx.shadowBlur = 4;
          const textRadius = radius * 0.73;
          const maxLen = Math.max(4, Math.floor(radius / 24));
          const name = options[i].length > maxLen ? options[i].substring(0, maxLen) + '…' : options[i];
          if (isLeftSide) {
            // Move out to radius, flip 180°, draw from outer edge inward
            // so text reads right-side up on the left half
            ctx.translate(textRadius, 0);
            ctx.rotate(Math.PI);
            ctx.textAlign = 'left';
            ctx.fillText(name, 0, 0);
          } else {
            ctx.textAlign = 'right';
            ctx.fillText(name, textRadius, 0);
          }
          ctx.shadowBlur = 0;
          ctx.restore();
        }

        // Inner hub circle
        ctx.beginPath();
        ctx.arc(0, 0, innerRadius + 4, 0, Math.PI * 2);
        const hubGrad = ctx.createRadialGradient(0, 0, innerRadius - 5, 0, 0, innerRadius + 6);
        hubGrad.addColorStop(0, '#1A1330');
        hubGrad.addColorStop(0.7, '#2D1B4E');
        hubGrad.addColorStop(1, '#A855F7');
        ctx.fillStyle = hubGrad;
        ctx.fill();

        ctx.beginPath();
        ctx.arc(0, 0, innerRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#0F0A1F';
        ctx.fill();

        // Decorative dots on inner ring
        ctx.fillStyle = 'rgba(168, 85, 247, 0.5)';
        for (let i = 0; i < 8; i++) {
          const a = (i / 8) * Math.PI * 2;
          ctx.beginPath();
          ctx.arc(Math.cos(a) * (innerRadius + 2), Math.sin(a) * (innerRadius + 2), 2, 0, Math.PI * 2);
          ctx.fill();
        }

        ctx.restore();

        // Winner glow overlay (above canvas rotate)
        if (winnerIdx !== null && winnerIdx >= 0 && winnerHighlight > 0) {
          ctx.save();
          ctx.translate(cx, cy);
          const winnerCenterAngle = -Math.PI / 2 + (winnerIdx + 0.5) * sectorAngle + rotation;
          const glowGrad = ctx.createRadialGradient(
            Math.cos(winnerCenterAngle) * radius * 0.65,
            Math.sin(winnerCenterAngle) * radius * 0.65,
            0,
            Math.cos(winnerCenterAngle) * radius * 0.65,
            Math.sin(winnerCenterAngle) * radius * 0.65,
            radius * 0.8
          );
          glowGrad.addColorStop(0, `rgba(251, 191, 36, ${0.4 * winnerHighlight})`);
          glowGrad.addColorStop(0.6, `rgba(251, 191, 36, ${0.15 * winnerHighlight})`);
          glowGrad.addColorStop(1, 'rgba(251, 191, 36, 0)');
          ctx.fillStyle = glowGrad;
          ctx.beginPath();
          ctx.arc(
            Math.cos(winnerCenterAngle) * radius * 0.65,
            Math.sin(winnerCenterAngle) * radius * 0.65,
            radius * 0.8,
            0, Math.PI * 2
          );
          ctx.fill();
          ctx.restore();
        }
      }, [options, colors]);

      // Easing function
      const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);

      // Handle spinning animation
      // Dependencies intentionally limited to [spinning, duration, draw]
      // options changes must NOT re-trigger this effect (prevents infinite re-spin loop)
      useEffect(() => {
        if (!spinning) {
          // Idle: draw once with current rotation
          draw(rotationRef.current);
          return;
        }

        // Pre-determine result using latest options from ref
        const currentOptions = optionsRef.current;
        const numSectors = currentOptions.length;
        if (numSectors < 2) {
          draw(rotationRef.current);
          return;
        }

        const TWO_PI = Math.PI * 2;
        const sectorAngle = TWO_PI / numSectors;
        const targetIdx = Math.floor(Math.random() * numSectors);
        targetIndexRef.current = targetIdx;

        // Normalize start angle to [0, 2π) to eliminate accumulated precision error
        const normalizedStart = ((rotationRef.current % TWO_PI) + TWO_PI) % TWO_PI;
        rotationRef.current = normalizedStart;
        startRotationRef.current = normalizedStart;

        spinStartRef.current = performance.now();
        spinDurationRef.current = durationRef.current * 1000;

        // Random offset within ±30% of sector angle, guaranteeing pointer stays in target sector
        const randomOffset = (Math.random() - 0.5) * sectorAngle * 0.3;
        const fullRotations = 8 + Math.floor(Math.random() * 4); // 8-11 full rotations

        // Target final angle (normalized to [0, 2π)):
        // Pointer is at top (-π/2). Sector i center at rest is at: -π/2 + (i+0.5)*sectorAngle
        // After rotation R, sector i center is at: -π/2 + (i+0.5)*sectorAngle + R
        // We want target sector center at top (-π/2):
        //   -π/2 + (targetIdx+0.5)*sa + R ≡ -π/2 (mod 2π)
        //   R ≡ -(targetIdx+0.5)*sa (mod 2π)
        const targetNormalized = ((-(targetIdx + 0.5) * sectorAngle + randomOffset) % TWO_PI + TWO_PI) % TWO_PI;

        // Forward delta (clockwise) from current angle to target angle
        let angleDelta = targetNormalized - normalizedStart;
        if (angleDelta < 0) angleDelta += TWO_PI;

        const totalDelta = fullRotations * TWO_PI + angleDelta;
        const finalRotation = normalizedStart + totalDelta;
        finalRotationRef.current = finalRotation;

        let finished = false;

        const animate = (now) => {
          const elapsed = now - spinStartRef.current;
          const dur = spinDurationRef.current;
          const t = Math.min(1, elapsed / dur);
          const eased = easeOutCubic(t);
          rotationRef.current = startRotationRef.current + totalDelta * eased;

          // Pointer shake: intensity proportional to current speed
          const speedFactor = 3 * (1 - t) * (1 - t);
          const shakeFn = onPointerShakeRef.current;
          if (shakeFn) {
            shakePhaseRef.current += 0.3 + speedFactor * 0.5;
            const shakeDeg = (Math.sin(shakePhaseRef.current) * 0.6 + Math.sin(shakePhaseRef.current * 1.7) * 0.4) * speedFactor * 5;
            shakeFn(shakeDeg);
          }

          draw(rotationRef.current);

          if (t < 1) {
            animFrameRef.current = requestAnimationFrame(animate);
          } else {
            // Snap to exact final rotation and highlight winner
            rotationRef.current = finalRotation;
            draw(finalRotation, targetIdx, 1);

            // Pointer bounce-back effect on stop
            if (shakeFn) {
              const bounceDuration = 300;
              const bounceStart = performance.now();
              const bounceAnimate = (now2) => {
                const bounceElapsed = now2 - bounceStart;
                const bt = Math.min(1, bounceElapsed / bounceDuration);
                // Damped oscillation back to 0
                const bounceDeg = Math.sin(bt * Math.PI * 2.5) * Math.pow(1 - bt, 1.5) * -3;
                shakeFn(bounceDeg * (1 - bt));
                if (bt < 1) {
                  shakeFrameRef.current = requestAnimationFrame(bounceAnimate);
                } else {
                  shakeFn(0);
                }
              };
              shakeFrameRef.current = requestAnimationFrame(bounceAnimate);
            }

            finished = true;
            const cb = onSpinEndRef.current;
            if (cb) cb(targetIdx);
          }
        };

        animFrameRef.current = requestAnimationFrame(animate);

        return () => {
          if (animFrameRef.current) {
            cancelAnimationFrame(animFrameRef.current);
            animFrameRef.current = null;
          }
          if (shakeFrameRef.current) {
            cancelAnimationFrame(shakeFrameRef.current);
            shakeFrameRef.current = null;
          }
          if (!finished && onPointerShakeRef.current) {
            onPointerShakeRef.current(0);
          }
        };
      }, [spinning, duration, draw]);

      // Redraw when options/colors/result change and wheel is not spinning
      useEffect(() => {
        if (spinning) return;
        if (result !== null && result >= 0 && result < options.length) {
          draw(rotationRef.current, result, 1);
        } else {
          draw(rotationRef.current);
        }
      }, [options, colors, draw, spinning, result]);

       // Resize: fit canvas to container responsively
       useEffect(() => {
         const resize = () => {
           const canvas = canvasRef.current;
           if (!canvas) return;
           const container = canvas.parentElement;
           if (!container) return;
           // Use container width as size (container is square via aspect-ratio)
           const size = container.clientWidth;
           if (size <= 0) return;
           const dpr = window.devicePixelRatio || 1;
           canvas.width = size * dpr;
           canvas.height = size * dpr;
           const ctx = canvas.getContext('2d');
           ctx.setTransform(1, 0, 0, 1, 0, 0); // reset transform
           ctx.scale(dpr, dpr);
           const winnerIdx = result !== null && result >= 0 && result < options.length ? result : null;
           if (winnerIdx !== null) {
             draw(rotationRef.current, winnerIdx, 1);
           } else {
             draw(rotationRef.current);
           }
         };
         // Delay first resize to ensure container layout is ready
         const t = setTimeout(resize, 0);
         window.addEventListener('resize', resize);
         // Observe container size changes in case of layout shifts
         let ro = null;
         if (typeof ResizeObserver !== 'undefined') {
           ro = new ResizeObserver(() => resize());
           const container = canvasRef.current?.parentElement;
           if (container) ro.observe(container);
         }
         return () => {
           clearTimeout(t);
           window.removeEventListener('resize', resize);
           if (ro) ro.disconnect();
         };
       }, [draw, result, options.length]);

      return (
        <canvas ref={canvasRef} className="wheel-canvas" />
      );
    };

    // ============ Modal Component ============
    const Modal = ({ isOpen, onClose, children, className = '' }) => {
      useEffect(() => {
        if (isOpen) {
          document.body.style.overflow = 'hidden';
        } else {
          document.body.style.overflow = '';
        }
        return () => { document.body.style.overflow = ''; };
      }, [isOpen]);

      if (!isOpen) return null;

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className={`modal ${className}`} onClick={e => e.stopPropagation()}>
            {children}
          </div>
        </div>
      );
    };

    // ============ Confirm Dialog ============
    const ConfirmDialog = ({ isOpen, onConfirm, onCancel, title, description, confirmText = '确认', danger = false }) => (
      <Modal isOpen={isOpen} onClose={onCancel} className="confirm-modal">
        <div className="confirm-title">{title}</div>
        <div className="confirm-desc">{description}</div>
        <div className="confirm-actions">
          <button className="btn btn-secondary" onClick={onCancel}>取消</button>
          <button className={`btn ${danger ? 'btn-danger' : 'btn-primary'}`} onClick={onConfirm}>{confirmText}</button>
        </div>
      </Modal>
    );

    // ============ Wheel Page ============
    const WheelPage = ({ options, setOptions, removedOptions, setRemovedOptions, scheme, addHistory, settings }) => {
      const [spinning, setSpinning] = useState(false);
      const [result, setResult] = useState(null);
      const [resultOpen, setResultOpen] = useState(false);
      const [winnerInfo, setWinnerInfo] = useState({ name: null, color: null });
      const [importText, setImportText] = useState('');
      const [pointerShake, setPointerShake] = useState(0);
      const audioRef = useRef(null);
      const { canvasRef: confettiRef, trigger: triggerConfetti } = useConfetti();
      const { showToast } = useToast();
      const colors = COLOR_SCHEMES[scheme].colors;

      const handleSpin = () => {
        if (options.length < 2) {
          showToast('至少需要2个选项才能转动', 'error');
          return;
        }
        if (spinning) return;

        setResult(null);
        setWinnerInfo({ name: null, color: null });
        setSpinning(true);

        // Play BGM
        if (settings.bgmEnabled && audioRef.current) {
          audioRef.current.volume = settings.bgmVolume;
          audioRef.current.currentTime = 0;
          audioRef.current.play().catch(() => {
            // Autoplay might fail silently
          });
        }
      };

      const handleSpinEnd = (index) => {
        const winner = options[index];
        setSpinning(false);
        setResult(index);
        setResultOpen(true);
        setWinnerInfo({ name: winner, color: colors[index % colors.length] });
        triggerConfetti();

        // Auto move winner to removed list
        setOptions(prev => prev.filter((_, i) => i !== index));
        setRemovedOptions(prev => [...prev, winner]);

        // Fade out BGM
        if (audioRef.current && !audioRef.current.paused) {
          const fadeDuration = 1000;
          const startVolume = settings.bgmVolume;
          const startTime = performance.now();
          const fade = (now) => {
            const elapsed = now - startTime;
            const t = Math.min(1, elapsed / fadeDuration);
            audioRef.current.volume = startVolume * (1 - t);
            if (t < 1) {
              requestAnimationFrame(fade);
            } else {
              audioRef.current.pause();
              audioRef.current.volume = startVolume;
            }
          };
          requestAnimationFrame(fade);
        }

        // Add to history
        addHistory({
          type: 'wheel',
          options: [...options],
          result: winner,
          timestamp: Date.now(),
        });
      };

      const handleImport = () => {
        const names = parseNames(importText);
        if (names.length === 0) {
          showToast('没有解析到有效选项', 'error');
          return;
        }
        // Names already in options stay; names only in removedOptions get restored
        const existingOptionsSet = new Set(options);
        const removedSet = new Set(removedOptions);
        const newOptions = [...options];
        let restoredCount = 0;
        let addedCount = 0;

        for (const name of names) {
          if (existingOptionsSet.has(name)) continue;
          if (removedSet.has(name)) {
            // Restore from removed
            newOptions.push(name);
            restoredCount++;
          } else {
            newOptions.push(name);
            addedCount++;
          }
        }

        // Remove restored names from removedOptions
        if (restoredCount > 0) {
          const restoredNames = names.filter(n => removedSet.has(n));
          setRemovedOptions(prev => prev.filter(n => !restoredNames.includes(n)));
        }

        setOptions(newOptions);
        setImportText('');
        const total = addedCount + restoredCount;
        if (restoredCount > 0) {
          showToast(`导入 ${total} 个（含复原 ${restoredCount} 个已抽中）`, 'success');
        } else {
          showToast(`成功导入 ${total} 个选项`, 'success');
        }
      };

      const handleAddOption = () => {
        const newName = `选项${options.length + 1}`;
        setOptions([...options, newName]);
      };

      const handleRemoveOption = (index) => {
        const newOptions = options.filter((_, i) => i !== index);
        setOptions(newOptions);
      };

      const handleEditOption = (index, value) => {
        const newOptions = [...options];
        newOptions[index] = value;
        setOptions(newOptions);
      };

      const handleClearOptions = () => {
        setOptions([]);
        showToast('已清空所有待抽选项', 'success');
      };

      const handleRestoreOne = (index) => {
        const name = removedOptions[index];
        setRemovedOptions(prev => prev.filter((_, i) => i !== index));
        setOptions(prev => [...prev, name]);
        showToast(`已复原「${name}」`, 'success');
      };

      const handleRestoreAll = () => {
        if (removedOptions.length === 0) return;
        setOptions(prev => [...prev, ...removedOptions]);
        setRemovedOptions([]);
        showToast(`已全部复原 ${removedOptions.length} 人`, 'success');
      };

      return (
        <div className="page">
          <audio ref={audioRef} src="https://aka.doubaocdn.com/s/Ke9mBUc5uL" preload="auto" />

          <div className="page-header">
            <h1 className="page-title">抽你丫的</h1>
          </div>

          <div className="wheel-layout">
              <div className="wheel-section">
              <div className={`wheel-container ${spinning ? 'spinning' : ''}`}>
                <div className="wheel-outer-ring"></div>
                <div
                  className="wheel-pointer"
                  style={{ transform: `translateX(-50%) rotate(${pointerShake}deg)` }}
                >
                  <svg viewBox="0 0 42 58" fill="none">
                    <defs>
                      <linearGradient id="pointerGrad" x1="21" y1="0" x2="21" y2="58" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stopColor="#FEF3C7"/>
                        <stop offset="30%" stopColor="#FBBF24"/>
                        <stop offset="70%" stopColor="#F59E0B"/>
                        <stop offset="100%" stopColor="#B45309"/>
                      </linearGradient>
                      <radialGradient id="gemGrad" cx="50%" cy="40%" r="60%">
                        <stop offset="0%" stopColor="#FEF3C7"/>
                        <stop offset="50%" stopColor="#FBBF24"/>
                        <stop offset="100%" stopColor="#D97706"/>
                      </radialGradient>
                    </defs>
                    {/* Pointer body */}
                    <path
                      d="M21 56 L6 22 C3 14 3 6 21 2 C39 6 39 14 36 22 L21 56 Z"
                      fill="url(#pointerGrad)"
                      stroke="#FCD34D"
                      strokeWidth="1.5"
                    />
                    {/* Highlight */}
                    <path
                      d="M15 12 C14 8 15 5 21 4 C19 8 17 10 15 12 Z"
                      fill="rgba(255,255,255,0.5)"
                    />
                    {/* Gem */}
                    <circle cx="21" cy="16" r="6" fill="url(#gemGrad)" stroke="#FDE68A" strokeWidth="1.5"/>
                    <circle cx="19.5" cy="14.5" r="2" fill="rgba(255,255,255,0.6)"/>
                    {/* Bottom tip */}
                    <path
                      d="M21 56 L17 48 L25 48 Z"
                      fill="#92400E"
                    />
                  </svg>
                </div>
                <WheelCanvas
                  options={options}
                  spinning={spinning}
                  result={result}
                  duration={settings.spinDuration}
                  schemeColors={colors}
                  onSpinEnd={handleSpinEnd}
                  onPointerShake={setPointerShake}
                />
                <div className="wheel-center">
                  <Icon.Wheel />
                </div>
              </div>

              <button className="spin-btn" onClick={handleSpin} disabled={spinning || options.length < 2}>
                <span>
                  <Icon.Play />
                  {spinning ? '转动中...' : '开始转动'}
                </span>
              </button>
            </div>

            <div className="options-panel">
              <div className="card">
                <div className="card-header">
                  <div className="card-title">
                    <div className="card-title-icon"><Icon.Users /></div>
                    批量导入
                  </div>
                </div>
                <div className="card-body">
                  <textarea
                    className="import-textarea"
                    placeholder="粘贴名单，每行一个&#10;支持智能解析：&#10;大宝 #5269 進入組隊房間&#10;小明 #1234&#10;也支持逗号、空格、顿号分隔"
                    value={importText}
                    onChange={e => setImportText(e.target.value)}
                  />
                  <div style={{ height: '10px' }} />
                  <div className="import-hint">
                    支持智能解析「<code>名字 #数字 进入组队房间</code>」格式，自动提取名字部分，去除#号及后缀
                  </div>
                  <div style={{ height: '14px' }} />
                  <div className="btn-row">
                    <button className="btn btn-primary" onClick={handleImport}>
                      <Icon.Plus /> 导入
                    </button>
                    <button className="btn btn-secondary" onClick={() => setImportText('')}>清空</button>
                  </div>
                </div>
              </div>

              <div className="card">
                <div className="card-header">
                  <div className="card-title">
                    <div className="card-title-icon"><Icon.Wheel /></div>
                    待抽选项
                  </div>
                  <div className="options-count">
                    共 <strong>{options.length}</strong> 个
                  </div>
                </div>
                <div className="card-body">
                  {options.length === 0 ? (
                    <div className="empty-state" style={{ padding: '32px 20px' }}>
                      <div className="empty-icon"><Icon.Users /></div>
                      <div className="empty-title" style={{ fontSize: '15px' }}>暂无待抽选项</div>
                      <div className="empty-desc" style={{ fontSize: '13px' }}>在上方批量导入或手动添加</div>
                    </div>
                  ) : (
                    <div className="options-list">
                      {options.map((opt, i) => (
                        <div key={i} className="option-item">
                          <span className="option-color" style={{ background: colors[i % colors.length] }} />
                          <input
                            className="option-name"
                            value={opt}
                            onChange={e => handleEditOption(i, e.target.value)}
                          />
                          <button className="option-remove" onClick={() => handleRemoveOption(i)} title="移除">
                            <Icon.X />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                  <div style={{ height: '14px' }} />
                  <div className="btn-row">
                    <button className="btn btn-secondary btn-sm" onClick={handleAddOption}>
                      <Icon.Plus /> 添加
                    </button>
                    {options.length > 0 && (
                      <button className="btn btn-danger btn-sm" onClick={handleClearOptions}>
                        <Icon.Trash /> 清空
                      </button>
                    )}
                  </div>
                </div>
              </div>

              {/* Removed list */}
              <div className="card removed-card">
                <div className="card-header">
                  <div className="card-title">
                    <div className="card-title-icon" style={{ background: 'rgba(156, 163, 175, 0.15)', color: 'var(--text-muted)' }}><Icon.Check /></div>
                    已抽中
                  </div>
                  <div className="options-count">
                    共 <strong style={{ color: 'var(--text-muted)' }}>{removedOptions.length}</strong> 个
                  </div>
                </div>
                <div className="card-body">
                  {removedOptions.length === 0 ? (
                    <div className="empty-state" style={{ padding: '24px 20px' }}>
                      <div className="empty-icon" style={{ width: '48px', height: '48px' }}><Icon.Check /></div>
                      <div className="empty-desc" style={{ fontSize: '12px' }}>尚未抽中任何人</div>
                    </div>
                  ) : (
                    <div className="options-list" style={{ maxHeight: '220px' }}>
                      {removedOptions.map((opt, i) => (
                        <div key={i} className="option-item removed-item">
                          <span className="option-color" style={{ background: 'var(--text-muted)', opacity: 0.4 }} />
                          <span className="option-name removed-name">{opt}</span>
                          <button className="option-restore" onClick={() => handleRestoreOne(i)} title="复原">
                            <Icon.Upload style={{ transform: 'rotate(180deg)', width: '14px', height: '14px' }} />
                          </button>
                        </div>
                      ))}
                    </div>
                  )}
                  {removedOptions.length > 0 && (
                    <>
                      <div style={{ height: '14px' }} />
                      <button className="btn btn-secondary btn-sm btn-block" onClick={handleRestoreAll}>
                        <Icon.Upload style={{ transform: 'rotate(180deg)' }} /> 全部复原
                      </button>
                    </>
                  )}
                </div>
              </div>
            </div>
          </div>

          {/* Result Modal */}
          <Modal isOpen={resultOpen} onClose={() => setResultOpen(false)}>
            <div className="result-label">恭喜抽中</div>
            {winnerInfo.name && (
              <>
                <div
                  className="result-winner-color"
                  style={{ background: winnerInfo.color, color: winnerInfo.color }}
                />
                <div className="result-winner">{winnerInfo.name}</div>
              </>
            )}
            <button className="btn btn-primary btn-block" onClick={() => setResultOpen(false)}>
              <Icon.Check /> 太棒了
            </button>
          </Modal>

          <canvas ref={confettiRef} className="confetti-canvas" />
        </div>
      );
    };

    // ============ Grouping Page ============
    const GroupingPage = ({ options, setOptions, scheme, addHistory, settings, updateLeaderboard }) => {
      const [mode, setMode] = useState('wheel'); // 'wheel' or 'quick'
      const [groupCount, setGroupCount] = useState(4);
      const [perGroup, setPerGroup] = useState(3);
      const [groups, setGroups] = useState([]);
      const [ranks, setRanks] = useState({}); // groupIndex -> rank
      const [settled, setSettled] = useState(false);
      const [wheelStep, setWheelStep] = useState(0); // current person index to assign
      const [currentAssignGroup, setCurrentAssignGroup] = useState(0);
      const [spinning, setSpinning] = useState(false);
      const [wheelResult, setWheelResult] = useState(null);
      const [groupPointerShake, setGroupPointerShake] = useState(0);
      const { showToast } = useToast();
      const colors = COLOR_SCHEMES[scheme].colors;

      const totalNeeded = groupCount * perGroup;

      const canStart = options.length >= groupCount && options.length >= 2;

      const initGroups = () => {
        const g = Array.from({ length: groupCount }, (_, i) => ({
          id: uid(),
          name: `第${['一','二','三','四','五','六','七','八'][i] || i+1}组`,
          members: [],
        }));
        setGroups(g);
        setRanks({});
        setSettled(false);
        setWheelStep(0);
        setCurrentAssignGroup(0);
        setWheelResult(null);
      };

      useEffect(() => {
        initGroups();
      }, [groupCount, perGroup]);

      const handleQuickGroup = () => {
        if (!canStart) {
          showToast('选项数量不足', 'error');
          return;
        }
        const shuffled = shuffleArray([...options]);
        const g = Array.from({ length: groupCount }, (_, i) => ({
          id: uid(),
          name: `第${['一','二','三','四','五','六','七','八'][i] || i+1}组`,
          members: [],
        }));
        for (let i = 0; i < shuffled.length; i++) {
          const gi = i % groupCount;
          if (g[gi].members.length < perGroup) {
            g[gi].members.push(shuffled[i]);
          }
        }
        setGroups(g);
        setRanks({});
        setSettled(false);
        showToast('分组完成！', 'success');
      };

      // Wheel grouping mode
      const handleWheelAssignStart = () => {
        if (!canStart) {
          showToast('选项数量不足', 'error');
          return;
        }
        setWheelStep(0);
        setCurrentAssignGroup(0);
        setWheelResult(null);
        setSpinning(true);
      };

      const handleWheelSpinEnd = (index) => {
        setSpinning(false);
        setWheelResult(index);
      };

      const handleConfirmAssign = () => {
        if (wheelResult === null) return;
        const person = options[wheelResult];
        const newGroups = [...groups];
        newGroups[currentAssignGroup].members.push(person);
        setGroups(newGroups);

        // Remove from remaining
        const remaining = options.filter((_, i) => i !== wheelResult);
        setOptions(remaining);

        // Next
        const nextGroup = currentAssignGroup + 1;
        if (nextGroup < groupCount && remaining.length > 0) {
          setCurrentAssignGroup(nextGroup);
          setWheelResult(null);
          if (mode === 'wheel' && remaining.length > 0) {
            // Auto spin next
            setTimeout(() => setSpinning(true), 500);
          }
        } else if (nextGroup >= groupCount && wheelStep + 1 < perGroup && remaining.length > 0) {
          // Next round
          setWheelStep(wheelStep + 1);
          setCurrentAssignGroup(0);
          setWheelResult(null);
          setTimeout(() => setSpinning(true), 500);
        } else {
          // Done
          setWheelResult(null);
          setSettled(false);
          addHistory({
            type: 'group',
            groups: newGroups.map(g => ({ name: g.name, members: [...g.members] })),
            timestamp: Date.now(),
          });
          showToast('分组完成！', 'success');
        }
      };

      const handleRankChange = (groupIndex, rank) => {
        const newRanks = { ...ranks, [groupIndex]: rank ? parseInt(rank) : null };
        setRanks(newRanks);
      };

      const handleSettle = () => {
        const allRanked = groups.every((_, i) => ranks[i]);
        if (!allRanked) {
          showToast('请为所有组设置名次', 'error');
          return;
        }
        setSettled(true);

        // Update leaderboard
        const scoreRules = settings.scoreRules;
        const updates = [];
        groups.forEach((g, i) => {
          const rank = ranks[i];
          const score = scoreRules[rank] || 0;
          g.members.forEach(name => {
            updates.push({ name, score, rank });
          });
        });
        updateLeaderboard(updates);

        // Add history with results
        addHistory({
          type: 'group',
          groups: groups.map((g, i) => ({
            name: g.name,
            members: [...g.members],
            rank: ranks[i] || null,
            score: scoreRules[ranks[i]] || 0,
          })),
          timestamp: Date.now(),
          settled: true,
        });

        showToast('结算完成！排行榜已更新', 'success');
      };

      // Drag and drop
      const [draggedItem, setDraggedItem] = useState(null);

      const handleDragStart = (e, fromGroup, memberIndex) => {
        setDraggedItem({ fromGroup, memberIndex });
        e.dataTransfer.effectAllowed = 'move';
      };

      const handleDragOver = (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
      };

      const handleDrop = (e, toGroup) => {
        e.preventDefault();
        if (!draggedItem) return;
        if (draggedItem.fromGroup === toGroup) {
          setDraggedItem(null);
          return;
        }

        const newGroups = JSON.parse(JSON.stringify(groups));
        const [moved] = newGroups[draggedItem.fromGroup].members.splice(draggedItem.memberIndex, 1);
        newGroups[toGroup].members.push(moved);
        setGroups(newGroups);
        setDraggedItem(null);
      };

      const wheelOptions = options.filter(o => {
        const allMembers = groups.flatMap(g => g.members);
        return !allMembers.includes(o);
      });

      const remainingOptions = mode === 'wheel' ? wheelOptions : options;

      return (
        <div className="page">
          <div className="page-header">
            <h1 className="page-title">游戏分组</h1>
            <p className="page-subtitle">快速随机分组，或用转盘逐个抽取分配</p>
          </div>

          <div className="grouping-layout">
            <div className="group-settings">
              <div className="card">
                <div className="card-header">
                  <div className="card-title">
                    <div className="card-title-icon"><Icon.Settings /></div>
                    分组设置
                  </div>
                </div>
                <div className="card-body">
                  <div className="setting-row">
                    <div className="setting-label">
                      分组模式
                    </div>
                    <div className="mode-tabs">
                      <button
                        className={`mode-tab ${mode === 'wheel' ? 'active' : ''}`}
                        onClick={() => setMode('wheel')}
                      >
                        转盘分组
                      </button>
                      <button

                      className="range-slider"
                      min="1"
                      max="10"
